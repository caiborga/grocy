name: Deploy to VM

on:
    push:
        branches: [main]

jobs:
    build-and-deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: actions/checkout@v4

            - name: Set up JDK 21
              uses: actions/setup-java@v4
              with:
                  java-version: "21"
                  distribution: "temurin"

            - name: Build with Maven
              run: | 
                  chmod +x mvnw
                  ./mvnw clean package -DskipTests

            - name: Copy JAR to VM
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VM_IP }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: "target/*.jar"
                  target: "/home/${{ secrets.VM_USER }}/app"
                  strip_components: 1

            - name: Restart Application via SSH
              uses: appleboy/ssh-action@v1.0.3
              with:
                  host: ${{ secrets.VM_IP }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  script: |
                      # Prozess beenden, wenn er läuft
                      pgrep -f my-app.jar | xargs -r kill -9
                      nohup java -jar /home/${{ secrets.VM_USER }}/app/my-app.jar > log.txt 2>&1 &
                      sleep 2
