spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  jpa:
    show-sql: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 1MB

server:
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
  tomcat:
    max-http-form-post-size: 1MB
    max-swallow-size: 1MB

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    org.hibernate.SQL: WARN
    org.hibernate.orm.jdbc.bind: WARN
    org.springframework.web: WARN

app:
  jwt:
    secret: ${JWT_SECRET}
  frontend-url: ${APP_FRONTEND_URL}
  mail:
    from: ${APP_MAIL_FROM}
    enabled: ${APP_MAIL_ENABLED:true}
  registration:
    enabled: ${APP_REGISTRATION_ENABLED:false}
  admin:
    emails: ${APP_ADMIN_EMAILS:}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
