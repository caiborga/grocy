services:
  db:
    image: postgres:16-alpine
    container_name: grocy-db
    restart: unless-stopped
    ports:
      - "3300:5432"
    environment:
      POSTGRES_DB: grocy
      POSTGRES_USER: grocy_admin
      POSTGRES_PASSWORD: grocy
    volumes:
      - grocy_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U grocy_admin -d grocy"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  grocy_pg_data:
